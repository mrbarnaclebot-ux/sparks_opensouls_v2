# Render Blueprint for SPARK Terminal UI
# Deploy without Docker - uses Node.js native runtime

databases:
  # PostgreSQL Database for data persistence
  - name: soul-engine-db
    databaseName: soul_engine_db
    user: soul_engine_user
    region: oregon
    plan: free

services:
  # 1. Redis Instance for caching and messaging
  - type: redis
    name: soul-engine-redis
    region: oregon # Or your preferred region
    plan: free
    ipAllowList: [] # Allow all connections

  # 3. Backend Service: Soul Engine Cloud
  # This service runs the main AI and WebSocket logic.
  # We use the "Starter" plan to get a more powerful build instance, which helps prevent timeouts.
  - type: web
    name: soul-engine-cloud
    env: node
    region: oregon
    plan: starter # 'starter' provides more resources for the build process
    healthCheckPath: /health
    rootDir: packages/soul-engine-cloud
    buildFilter:
      paths:
      - "packages/soul-engine-cloud/**"
      - "packages/core/**"
      - "library/**"
      - "bun.lockb"
    buildCommand: |
      npm i -g bun
      cd ../..
      bun install --frozen-lockfile
      cd packages/soul-engine-cloud
      bun run prisma:generate
    startCommand: "bun run start"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: soul-engine-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: soul-engine-redis
          property: connectionString
      # IMPORTANT: Set this secret in the Render Dashboard
      - key: OPENAI_API_KEY
        sync: false
      # This sets the public URL for the backend service itself
      - key: VITE_SOUL_ENGINE_API_URL
        value: https://soul-engine-cloud.onrender.com

  # 4. Frontend Service: Soul Engine UI
  # This is the Next.js web interface for chatting with the soul.
  - type: web
    name: soul-engine-ui
    env: node
    region: oregon
    plan: free
    rootDir: packages/soul-engine-ui
    buildFilter:
      paths:
      - "packages/soul-engine-ui/**"
      - "packages/core/**"
      - "library/**"
      - "bun.lockb"
    buildCommand: |
      npm i -g bun
      cd ../..
      bun install --frozen-lockfile
      cd packages/soul-engine-ui
      bun run build
    startCommand: "bun run start"
    envVars:
      - key: NODE_ENV
        value: production
      # IMPORTANT: This points the UI to your deployed backend WebSocket endpoint.
      - key: NEXT_PUBLIC_HOCUS_POCUS_HOST
        value: wss://soul-engine-cloud.onrender.com
      - key: NEXT_PUBLIC_ORGANIZATION_SLUG
        value: local
      - key: NEXT_PUBLIC_SOUL_ID
        value: SPARK
