# Render.com Blueprint for Soul Engine
# Deploy both services with: Dashboard → Blueprints → New Blueprint Instance
# Documentation: https://render.com/docs/blueprint-spec

services:
  # ===========================================
  # Backend: Soul Engine Cloud API
  # ===========================================
  - type: web
    name: soul-engine-cloud
    runtime: docker
    region: oregon # Change to: oregon, ohio, frankfurt, singapore
    plan: starter # Options: free, starter ($7), standard ($25), pro ($85)
    rootDir: packages/soul-engine-cloud
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    numInstances: 1
    envVars:
      # Required: OpenAI API Key (set manually in dashboard for security)
      - key: OPENAI_API_KEY
        sync: false
      # Server Configuration
      - key: PORT
        value: '4000'
      - key: NODE_ENV
        value: production
      # Data Paths (must match disk mount)
      - key: CODE_PATH
        value: /app/data/code
      - key: PGLITE_DATA_DIR
        value: /app/data/pglite
      # Optional: Alternative AI Providers (uncomment and set in dashboard)
      # - key: ANTHROPIC_API_KEY
      #   sync: false
      # - key: MISTRAL_API_KEY
      #   sync: false
      # - key: FIREWORKS_API_KEY
      #   sync: false
      # - key: TOGETHER_API_KEY
      #   sync: false
    disk:
      name: soul-engine-data
      mountPath: /app/data
      sizeGB: 1 # Increase as needed

  # ===========================================
  # Frontend: Soul Engine UI (Next.js)
  # ===========================================
  - type: web
    name: soul-engine-ui
    runtime: docker
    region: oregon # Should match backend region for lower latency
    plan: starter # Options: free, starter ($7), standard ($25), pro ($85)
    # Note: Root directory is repo root because Dockerfile builds from monorepo
    dockerfilePath: packages/soul-engine-ui/Dockerfile
    healthCheckPath: /
    numInstances: 1
    envVars:
      # WebSocket URL - automatically references the backend service
      - key: NEXT_PUBLIC_HOCUS_POCUS_HOST
        fromService:
          name: soul-engine-cloud
          type: web
          property: hostWSS
      # Soul Configuration
      - key: NEXT_PUBLIC_ORGANIZATION_SLUG
        value: local
      - key: NEXT_PUBLIC_SUBROUTINE_ID
        value: SPARK
      # Server Configuration
      - key: PORT
        value: '3000'
      - key: NODE_ENV
        value: production
